<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f3269 0%, #1f5fa9 100%);
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px 120px;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            z-index: -1;
        }
        #welcome {
            font-size: 4em;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #fff;
            animation: blink-caret 1s step-end infinite, glow 2s ease-in-out infinite alternate;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #fff; }
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255,255,255,0.5); }
            to { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.5); }
        }
        .subtitle {
            font-size: 1.5em;
            color: #e0e0e0;
            animation: fadeInUp 2s ease-out 1s both;
            text-align: center;
            margin-bottom: 30px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .images {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 980px;
            animation: slideIn 3s ease-out 2s both;
            margin: 0 auto;
        }
        .image-card {
            display: block;
            border-radius: 24px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.3);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
            transition: transform 0.3s ease, border-color 0.3s ease;
            background: rgba(255,255,255,0.08);
            text-decoration: none;
        }
        .image-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.8);
        }
        .image-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .image-card span {
            display: block;
            padding: 14px 12px;
            color: #fff;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(180deg, rgba(15,50,105,0.95) 0%, rgba(15,50,105,0.6) 100%);
        }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 6s ease-in-out infinite;
        }
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }
        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 20%;
            animation-delay: 4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 20px;
        }
        .footer-links {
            display: flex;
            gap: 20px;
        }
        .footer-links a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }
        .footer-links a:hover {
            color: #00d4ff;
        }
        .footer-links svg {
            width: 20px;
            height: 20px;
        }
        .copyright {
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>

    <script>
        const text = "Welcome to Our Planet";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("welcome").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 150);
            }
        }
        window.onload = typeWriter;
    </script>
